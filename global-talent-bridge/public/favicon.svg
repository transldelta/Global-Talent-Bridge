<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Deep navy background -->
  <rect width="32" height="32" rx="6" fill="#0b1527"/>
  <!-- Corridor concept: two nodes connected by an arc — the platform metaphor -->
  <circle cx="8"  cy="11" r="2"   fill="#6366f1"/>
  <circle cx="24" cy="11" r="2"   fill="#818cf8"/>
  <path d="M10 11 Q16 5 22 11" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- CW monogram — clean, well-proportioned -->
  <text
    x="16" y="26"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="11"
    font-weight="800"
    letter-spacing="0.8"
  >CW</text>
</svg>
